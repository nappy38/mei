<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>おやすみ日報</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10121b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #10121b;
    --bg-glow: #191c2c;
    --surface: #1c2032;
    --surface-border: #2c3149;
    --text-primary: #eef0f7;
    --text-muted: #8d92ab;
    --accent: #d9a15b;
    --accent-soft: #f0c88a;
    --accent-dim: rgba(217, 161, 91, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 60% 45% at 50% 8%, var(--bg-glow) 0%, transparent 70%),
      var(--bg);
    color: var(--text-primary);
    font-family: "Sora", "Hiragino Sans", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  .moon {
    font-size: 28px;
    line-height: 1;
    opacity: 0.9;
    filter: drop-shadow(0 0 12px var(--accent-dim));
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(28px, 8vw, 34px);
    line-height: 1.3;
    margin: 0;
    text-wrap: balance;
    color: var(--text-primary);
  }

  p.lede {
    margin: 0;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.7;
    max-width: 30ch;
  }

  .send {
    appearance: none;
    text-decoration: none;
    border: 1px solid var(--surface-border);
    background: linear-gradient(180deg, var(--surface) 0%, #171a29 100%);
    color: var(--accent-soft);
    font-family: "Sora", sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.02em;
    width: 100%;
    padding: 22px 20px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 0 0 1px rgba(217, 161, 91, 0.08), 0 12px 32px -12px rgba(217, 161, 91, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .send:active {
    transform: scale(0.97);
    box-shadow: 0 0 0 1px rgba(217, 161, 91, 0.14), 0 6px 18px -8px rgba(217, 161, 91, 0.3);
  }

  .send:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .send .flame {
    font-size: 15px;
  }

  .steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 18px;
  }

  .steps .step {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-align: left;
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .steps .step b {
    color: var(--text-primary);
    font-weight: 500;
  }

  .steps .num {
    font-family: "Sora", sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    width: 14px;
  }

  .status {
    min-height: 18px;
    font-size: 12.5px;
    color: var(--accent-soft);
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .status.visible { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .send { transition: none; }
  }
</style>
</head>
<body>

<main>
  <div class="moon">🌙</div>
  <h1>今日も、おつかれさま</h1>
  <p class="lede">下のボタンを押すとメールが開く。<br>やったこと・つまったこと・明日を話して、送るだけ。</p>

  <a class="send" id="sendBtn" href="#">
    <span class="flame">✦</span>
    <span>今夜のひとことを送る</span>
  </a>

  <p class="lede status" id="fallback" style="font-size: 13px;"></p>

  <div class="steps">
    <div class="step"><span class="num">1</span><span>上のボタンを押す → メールアプリが<b>宛先・件名入り</b>で開く</span></div>
    <div class="step"><span class="num">2</span><span>本文欄でキーボードの<b>マイク</b>を押して話す</span></div>
    <div class="step"><span class="num">3</span><span>送信して、そのまま寝る</span></div>
  </div>
</main>

<script>
  (function () {
    var u = ['nappy', '.', 'nappy38'].join('');
    var d = ['gmail', '.', 'com'].join('');
    var addr = u + '@' + d;
    var mailto = 'mailto:' + addr + '?subject=' + encodeURIComponent('日報');

    var link = document.getElementById('sendBtn');
    link.href = mailto;

    var shown = false;
    link.addEventListener('click', function () {
      if (shown) return;
      shown = true;
      var fb = document.getElementById('fallback');
      fb.textContent = '開かなければ長押しでアドレスをコピーしてメールアプリへ';
      fb.classList.add('visible');
    });
  })();
</script>
</body>
</html>
