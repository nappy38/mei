<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>今日の一歩</title>
<link rel="icon" href="icon-v2.png" type="image/png">
<link rel="apple-touch-icon" href="icon-v2.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ece1c9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ece1c9;
    --bg-glow: #f8f1de;
    --surface: #fffbf1;
    --surface-border: #e3c3c6;
    --text-primary: #4a382f;
    --text-muted: #8c7a68;
    --pink: #d9a3a8;
    --pink-deep: #c1484a;
    --gold: #d9a83f;
    --teal: #5f97a0;
    --accent-dim: rgba(217, 163, 168, 0.28);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, #f3d9db 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 90% 90%, #f6e2a8 0%, transparent 60%),
      var(--bg);
    color: var(--text-primary);
    font-family: "Zen Maru Gothic", "Hiragino Sans", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
  }

  .mark {
    font-size: 40px;
    line-height: 1;
    filter: drop-shadow(0 6px 14px var(--accent-dim));
  }

  .eyebrow {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #fff;
    background: var(--pink-deep);
    padding: 6px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 0 #9c3536;
  }

  h1 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: clamp(22px, 7vw, 27px);
    line-height: 1.55;
    margin: 0;
    text-wrap: balance;
    color: var(--text-primary);
  }

  .detail {
    width: 100%;
    padding: 16px 18px;
    background: var(--surface);
    border: 2px dashed var(--surface-border);
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.6;
    color: var(--teal);
    word-break: break-all;
  }

  video {
    width: 100%;
    border-radius: 20px;
    border: 3px solid var(--surface);
    box-shadow: 0 10px 24px -10px rgba(74, 56, 47, 0.35);
    background: #000;
  }

  .note {
    margin: 0;
    color: var(--pink-deep);
    font-weight: 700;
    font-size: 13px;
    line-height: 1.7;
    max-width: 30ch;
  }

  .updated {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-muted);
    opacity: 0.8;
  }

  .skeleton {
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<main>
  <div class="mark">🔔</div>
  <div class="eyebrow">今日の一歩</div>
  <h1 id="headline" class="skeleton">読み込み中…</h1>
  <video id="video" controls playsinline preload="metadata" style="display:none;"></video>
  <div class="detail" id="detail" style="display:none;"></div>
  <p class="note" id="note" style="display:none;"></p>
  <p class="updated" id="updated"></p>
</main>

<script>
  (function () {
    fetch('./today.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var h = document.getElementById('headline');
        h.textContent = data.headline || '今日の一歩は準備中';
        h.classList.remove('skeleton');

        if (data.video) {
          var v = document.getElementById('video');
          v.src = data.video;
          v.style.display = 'block';
        }

        if (data.detail) {
          var d = document.getElementById('detail');
          d.textContent = data.detail;
          d.style.display = 'block';
        }

        if (data.note) {
          var n = document.getElementById('note');
          n.textContent = data.note;
          n.style.display = 'block';
        }

        if (data.date) {
          document.getElementById('updated').textContent = data.date + ' の一歩';
        }
      })
      .catch(function () {
        var h = document.getElementById('headline');
        h.textContent = '読み込めなかった。あとでもう一度開いてみて';
        h.classList.remove('skeleton');
      });
  })();
</script>
</body>
</html>
