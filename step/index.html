<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>今日の一歩</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10121b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #10121b;
    --bg-glow: #191c2c;
    --surface: #1c2032;
    --surface-border: #2c3149;
    --text-primary: #eef0f7;
    --text-muted: #8d92ab;
    --accent: #d9a15b;
    --accent-soft: #f0c88a;
    --accent-dim: rgba(217, 161, 91, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 60% 45% at 50% 8%, var(--bg-glow) 0%, transparent 70%),
      var(--bg);
    color: var(--text-primary);
    font-family: "Sora", "Hiragino Sans", "Yu Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
  }

  .mark {
    font-size: 26px;
    line-height: 1;
    opacity: 0.9;
    filter: drop-shadow(0 0 12px var(--accent-dim));
  }

  .eyebrow {
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(24px, 7.5vw, 30px);
    line-height: 1.4;
    margin: 0;
    text-wrap: balance;
    color: var(--text-primary);
  }

  .detail {
    width: 100%;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-muted);
    word-break: break-all;
  }

  .note {
    margin: 0;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.7;
    max-width: 30ch;
  }

  .updated {
    font-size: 11.5px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  .skeleton {
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<main>
  <div class="mark">☀︎</div>
  <div class="eyebrow">今日の一歩</div>
  <h1 id="headline" class="skeleton">読み込み中…</h1>
  <div class="detail" id="detail" style="display:none;"></div>
  <p class="note" id="note" style="display:none;"></p>
  <p class="updated" id="updated"></p>
</main>

<script>
  (function () {
    fetch('./today.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var h = document.getElementById('headline');
        h.textContent = data.headline || '今日の一歩は準備中';
        h.classList.remove('skeleton');

        if (data.detail) {
          var d = document.getElementById('detail');
          d.textContent = data.detail;
          d.style.display = 'block';
        }

        if (data.note) {
          var n = document.getElementById('note');
          n.textContent = data.note;
          n.style.display = 'block';
        }

        if (data.date) {
          document.getElementById('updated').textContent = data.date + ' の一歩';
        }
      })
      .catch(function () {
        var h = document.getElementById('headline');
        h.textContent = '読み込めなかった。あとでもう一度開いてみて';
        h.classList.remove('skeleton');
      });
  })();
</script>
</body>
</html>
